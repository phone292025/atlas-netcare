# Read-only, v2c, community "public", from anywhere: it only ever runs in a
# throwaway container for the test.
rocommunity public default
sysLocation Atlas test rack
sysContact atlas@example.invalid

# The "client count": an integer the test reads back as client_count.
# extend output lives under NET-SNMP-EXTEND-MIB; this OID is its first line's
# result code, so it reads 17.
extend clients /bin/sh -c "exit 17"
