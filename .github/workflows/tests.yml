name: Tests

# Runs the suite twice: once on SQLite, which is what a developer runs, and
# once on PostgreSQL with TimescaleDB, which is what Atlas runs on
# (docs/decisions/ADR-0011-postgresql-timescaledb.md).
#
# The second run is the one that decides. SQLite forgives things the real
# database does not. On MariaDB, the database Atlas used to run on, that gap
# let three defects through a green suite: MySQL-only FIELD(), MySQL-only
# DATE_FORMAT, and a timestamp column that rewrote itself on every update.
# The first run on PostgreSQL found three more: date buckets written for
# MariaDB, LIKE on json columns, and addresses that differed only in case.
#
# @see phpunit.pgsql.xml
# @see docs/07-testing.md

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.database }}
    # Pinned, not ubuntu-latest, which moves to Ubuntu 26 from 19 October 2026.
    # A new runner image should arrive as a commit somebody can revert, not as
    # a red build nobody changed anything to cause.
    runs-on: ubuntu-24.04

    strategy:
      # Both results wanted. Stopping the PostgreSQL run because SQLite failed
      # hides exactly the comparison this workflow exists to make.
      fail-fast: false
      matrix:
        include:
          - database: SQLite
            config: phpunit.xml
          - database: PostgreSQL
            config: phpunit.pgsql.xml

    services:
      postgres:
        # The image compose.yaml runs. The login and the database name are
        # the ones phpunit.pgsql.xml expects, and the image installs
        # TimescaleDB into POSTGRES_DB by itself.
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        # Over TCP: on a new volume the image first runs its init scripts on a
        # server that listens only on a socket, and pg_isready on the socket
        # would call that ready.
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U atlas -d atlas_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # ADR-0008 pins Laravel 12. 8.2 is the oldest PHP composer.json
          # allows and the one XAMPP ships. The Docker image runs 8.3.
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        # --no-interaction because a prompt in CI hangs until the job times out.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The version the project is built on locally. Node 20 reached end
          # of life in April 2026.
          node-version: '24'
          cache: npm

      - name: Build front-end assets
        # public/build is gitignored and both layouts call @vite, so without
        # this every test that renders a page dies on a missing manifest
        # rather than on anything to do with the code.
        run: |
          npm ci
          npm run build

      - name: Check that the database has TimescaleDB
        if: matrix.database == 'PostgreSQL'
        # Prints the extension's version, and fails if there is none. Without
        # this the run would pass on plain PostgreSQL, and the first sign
        # would be a hypertable migration failing in phase 1.
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U atlas -d atlas_test -tAc
          "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'"
          | grep .

      - name: Run the suite
        # --display-deprecations because warnings print above the summary,
        # where a filtered log would hide them (AGENTS.md).
        run: php artisan test -c ${{ matrix.config }} --display-deprecations

  stack:
    name: Docker stack
    # Builds the image and starts the whole stack from a fresh clone, the way
    # the README does, so a broken Dockerfile, compose.yaml or start script
    # fails here and not on somebody's machine (ADR-0012).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        # compose.yaml mounts .env and refuses to start without one.
        run: cp .env.example .env

      - name: Build the image and start the stack
        # --wait returns once the database and the app pass their health
        # checks, and fails if they haven't within five minutes.
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check the web app
        # The health route, and a page that renders only with the CSS and
        # JavaScript built inside the image.
        run: |
          curl -fsS http://127.0.0.1:8000/up > /dev/null
          curl -fsS http://127.0.0.1:8000/login | grep -q '/build/assets/app-'

      - name: Check that the image carries no tests
        # The container caches its config, and a test run against cached
        # config would wipe the real database (Dockerfile).
        run: docker compose exec -T app sh -c 'test ! -e tests && test ! -e phpunit.xml && test ! -e vendor/bin/phpunit'

      - name: Seed demo data and create the administrator
        # grep keeps the one-time password out of the log, which anybody can
        # read on a public repository.
        run: |
          docker compose exec -T app php artisan db:seed --force
          docker compose exec -T app php artisan atlas:create-admin | grep 'Administrator created'

      - name: Check that nothing restarted
        # Every service restarts itself after a crash, which would hide the
        # crash from the steps above. Each container must still be on its
        # first run.
        run: |
          for service in db app worker scheduler; do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q "$service")")
            echo "$service: $restarts restarts"
            test "$restarts" = 0
          done

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

  style:
    name: Pint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        # --test reports rather than rewrites: CI says what is wrong and the
        # author fixes it, so nobody is surprised by a commit they did not make.
        run: vendor/bin/pint --test
