# Atlas NetCare as one Docker Compose stack (docs/decisions/ADR-0012).
#
#   cp .env.example .env            once, on a fresh clone
#   docker compose up -d --build
#
# Then open http://localhost:8000. Follow the logs with:
#
#   docker compose logs -f app
#
# Every service restarts itself after a crash. The database password comes
# from DB_PASSWORD in .env, and compose refuses to start without one. Out of
# the box the stack listens on this machine only, over plain HTTP. To open it
# to other machines, give it a name and HTTPS first (ATLAS_SERVER_NAME below,
# docs/11-installation-guide.md). With APP_ENV=production the app refuses to
# start on unsafe settings (php artisan atlas:check-deployment).

# Shared by the three services that run Atlas itself: one image, three jobs.
x-atlas: &atlas
  build: .
  # A second stack builds its own tag, so it can't swap the code under this
  # one: the browser tests build `atlas-netcare:browser-tests`.
  image: atlas-netcare:${ATLAS_IMAGE_TAG:-local}
  restart: unless-stopped
  environment:
    # These win over the same names in .env, which may still describe an
    # older XAMPP setup. Inside the stack the database is the `db` service.
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: atlas
    DB_USERNAME: atlas
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to a long random password}
    # To the container's output, so `docker compose logs` shows them.
    LOG_CHANNEL: stderr
    QUEUE_CONNECTION: database
    # Whether the backup service runs, so atlas:check-backups knows to
    # expect backups, and where it copies them, which a production copy must
    # have (atlas:check-deployment).
    ATLAS_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    ATLAS_BACKUP_COPY_DIR: ${ATLAS_BACKUP_COPY_DIR:-}
    ATLAS_BACKUP_DIR: ${ATLAS_BACKUP_DIR:-./backups}
    # Where the stack is published, so the app knows whether only this
    # machine can reach it (config atlas.published_on_loopback).
    ATLAS_BIND: ${ATLAS_BIND:-127.0.0.1}
    APP_URL: ${ATLAS_URL:-http://localhost:${ATLAS_PORT:-8000}}
    # Empty serves plain HTTP on port 80. A host name (atlas.lab.internal,
    # or a public one) makes Caddy serve HTTPS for it on 443 and redirect
    # port 80 there: its own certificate authority for an internal name, Let's
    # Encrypt for a public one. Set ATLAS_URL to the https:// address with it.
    SERVER_NAME: ${ATLAS_SERVER_NAME:-:80}
    # The certificate for a client that names no host. Clients send no name
    # when they connect to an IP address, so with ATLAS_SERVER_NAME set to
    # one, Caddy had no certificate to offer and the handshake failed.
    CADDY_GLOBAL_OPTIONS: default_sni ${ATLAS_SERVER_NAME:-localhost}
    # Caddy refuses an API request body over 512 KB before PHP reads any of
    # it, including one sent without a length. The ingest endpoint's own
    # limit, atlas.ingest.max_kilobytes, is smaller (ADR-0017).
    CADDY_SERVER_EXTRA_DIRECTIVES: |
      request_body /api/* {
        max_size 512KB
      }

# The project's .env inside the container, in long form so that a missing .env
# is an error, rather than Docker quietly creating a directory called .env.
# ATLAS_ENV_FILE points a second stack at its own copy: the browser tests'
# stack uses one made from .env.example (tests/Browser/global-setup.js).
x-env-file: &env-file
  type: bind
  source: ${ATLAS_ENV_FILE:-./.env}
  target: /app/.env
  bind:
    create_host_path: false

services:
  db:
    # PostgreSQL 16 with the TimescaleDB extension (ADR-0011).
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    # TimescaleDB sends usage reports to Timescale unless told not to. The
    # image's TIMESCALEDB_TELEMETRY setting works through an init script,
    # which the mount below replaces and which only runs on a new volume, so
    # the setting goes on the command line instead.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      # Only read when the volume is new. Changing DB_PASSWORD later also
      # needs ALTER USER inside the database (docs/11-installation-guide.md).
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to a long random password}
    ports:
      # Bound to localhost only, so nothing else on the network can reach it.
      # It is published at all so the test suite, run on this machine, can
      # use the atlas_test database (phpunit.pgsql.xml). ATLAS_DB_PORT moves
      # it, so a second stack can run beside this one.
      - "127.0.0.1:${ATLAS_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # backup.sh and restore.sh, and the folder their dumps go to. The dumps
      # hold every account's email and password hash: backups/ is ignored by
      # git and kept out of the image.
      - ./docker/postgres/bin:/atlas:ro
      - ${ATLAS_BACKUP_DIR:-./backups}:/backups
    healthcheck:
      # Over TCP, the way the app connects. On a new volume the image first
      # runs its init scripts on a server that listens only on a socket, and
      # a check over the socket would call that ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The web app: migrates the schema on start, then serves on port 8000.
  app:
    <<: *atlas
    ports:
      # This machine only, unless ATLAS_BIND=0.0.0.0 opens it to the network,
      # for a phone on the same Wi-Fi (docs/11-installation-guide.md).
      - "${ATLAS_BIND:-127.0.0.1}:${ATLAS_PORT:-8000}:80"
      # HTTPS, served only once ATLAS_SERVER_NAME is set.
      - "${ATLAS_BIND:-127.0.0.1}:${ATLAS_HTTPS_PORT:-8443}:443"
    volumes:
      # Writable, so the first start can add an app key to .env.
      - *env-file
      # Caddy's certificates and its own certificate authority, kept so a
      # restart doesn't issue new ones that agents don't trust yet.
      - caddy-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Laravel's /up route. There is no curl or wget in the image, so PHP
      # makes the request, over HTTPS once ATLAS_SERVER_NAME is set.
      test: ["CMD", "php", "docker/app/healthcheck.php"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Background jobs. Waits for the app, so the schema and the key exist.
  worker:
    <<: *atlas
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    # Healthy while the worker process runs. The base image's own check asks
    # the web server, which this service doesn't run. Turning the check off
    # isn't an option: older Docker Compose versions, like the one on GitHub's
    # runners, then refuse `up --wait`. Restarts on a crash still come from
    # `restart: unless-stopped`.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan queue:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    volumes:
      - <<: *env-file
        read_only: true
    depends_on:
      app:
        condition: service_healthy

  # Scheduled commands: telemetry every minute, alarms, roster, risk.
  scheduler:
    <<: *atlas
    command: ["php", "artisan", "schedule:work"]
    # Healthy while the scheduler process runs, for the same reasons as the
    # worker's check.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    # No environment: here. It would replace the shared one above, database
    # settings and all, rather than add to it.
    volumes:
      - <<: *env-file
        read_only: true
      # backups/status, for atlas:check-backups. Read-only.
      - ${ATLAS_BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      app:
        condition: service_healthy

  # Daily backups into ./backups, kept 14 days, each restored once to prove
  # it, and copied to ATLAS_BACKUP_COPY_DIR when that is set
  # (docker/postgres/bin/backup-loop.sh). The same image as the database, so
  # pg_dump matches the server.
  # Behind the `backup` profile, which .env.example turns on: the browser and
  # load-test stacks run from this folder too, and their throwaway databases
  # must not fill ./backups.
  backup:
    profiles: [backup]
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    entrypoint: ["sh", "/atlas/backup-loop.sh"]
    environment:
      PGHOST: db
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to a long random password}
      POSTGRES_USER: atlas
      ATLAS_BACKUP_EVERY_HOURS: ${ATLAS_BACKUP_EVERY_HOURS:-24}
      ATLAS_BACKUP_KEEP_DAYS: ${ATLAS_BACKUP_KEEP_DAYS:-14}
      ATLAS_BACKUP_VERIFY: ${ATLAS_BACKUP_VERIFY:-true}
      # Non-empty when ATLAS_BACKUP_COPY_DIR is set, so the loop copies.
      ATLAS_BACKUP_COPY: ${ATLAS_BACKUP_COPY_DIR:-}
    volumes:
      - ./docker/postgres/bin:/atlas:ro
      - ${ATLAS_BACKUP_DIR:-./backups}:/backups
      # Without ATLAS_BACKUP_COPY_DIR this is backups/ again, and nothing is
      # copied to it.
      - ${ATLAS_BACKUP_COPY_DIR:-./backups}:/copy
    # Healthy while the newest good backup is recent, not merely while the
    # loop runs (docker/postgres/bin/backup-health.sh).
    healthcheck:
      test: ["CMD", "sh", "/atlas/backup-health.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
